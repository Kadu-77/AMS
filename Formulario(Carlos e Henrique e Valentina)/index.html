<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Inscrição - ETEC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="ficha">
        <header class="cabecalho">

            <div class="paula-souza">
                <span>CENTRO</span>
                <strong>PAULA SOUZA</strong>
            </div>

            <div class="governo">
                <small>GOVERNO DO ESTADO</small>
                <strong>SÃO PAULO</strong>
            </div>

            <div class="etec">
                <strong>ETEC</strong>
                <span>Monsenhor Antonio Magliano</span>
            </div>
        </header>
        <div class="titulo">
            Ficha de Inscrição
        </div>
        <section class="campo-grupo">
            <label for="nome">Nome do Candidato</label>
            <input type="text" id="nome">
        </section>
        <section class="linha">

            <div class="campo data">
                <label for="data">Data de</label>
                <input type="text" id="data">
            </div>

            <div class="campo documento">
                <label for="documento">Documento de</label>
                <input type="text" id="documento">
            </div>

            <div class="campo cpf">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf">
            </div>

            <div class="campo sexo">
                <label>Sexo</label>

                <div class="opcoes">
                    <label>
                        <input type="radio" name="sexo" value="M">
                        M
                    </label>

                    <label>
                        <input type="radio" name="sexo" value="F">
                        F
                    </label>
                </div>
            </div>

            <div class="campo turno">

                <label>
                    <input type="radio" name="turno" value="destro">
                    Destro
                </label>

                <label>
                    <input type="radio" name="turno" value="canhoto">
                    Canhoto
                </label>

            </div>

        </section>
        <div class="subtitulo">
            Endereço
        </div>

        <section class="linha endereco">

            <div class="campo endereco-principal">
                <label for="endereco">Endereço (Rua/Avenida, Praça)</label>
                <input type="text" id="endereco">
            </div>

            <div class="campo numero">
                <label for="numero">Número</label>
                <input type="text" id="numero">
            </div>

            <div class="campo complemento">
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento">
            </div>

        </section>
        <section class="linha">

            <div class="campo bairro">
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro">
            </div>

            <div class="campo cidade">
                <label for="cidade">Cidade</label>
                <input type="text" id="cidade">
            </div>

            <div class="campo estado">
                <label for="estado">Estado</label>

                <select id="estado">
                    <option>Selecione...</option>
                    <option>SP</option>
                    <option>RJ</option>
                    <option>MG</option>
                    <option>PR</option>
                </select>
            </div>

        </section>
        <section class="linha">

            <div class="campo cep">
                <label for="cep">CEP</label>
                <input type="text" id="cep">
            </div>

            <div class="campo telefone">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone">
            </div>

            <div class="campo celular">
                <label for="celular">Celular</label>
                <input type="text" id="celular">
            </div>

            <div class="tipo-escola">

                <label>
                    <input type="radio" name="escola" value="publica">
                    Escola Pública
                </label>

                <label>
                    <input type="radio" name="escola" value="particular">
                    Escola Particular
                </label>

            </div>

        </section>
        <section class="linha">

            <div class="campo email">
                <label for="email">E-Mail</label>
                <input type="email" id="email">
            </div>

            <div class="campo conclusao">
                <label for="conclusao">Ano de conclusão do</label>
                <input type="text" id="conclusao">
            </div>

            <div class="treineiro">

                <span>Treineiro</span>

                <label>
                    <input type="radio" name="treineiro" value="sim">
                    Sim
                </label>

                <label>
                    <input type="radio" name="treineiro" value="nao">
                    Não
                </label>

            </div>

        </section>
        <section class="necessidades">

            <p>É Portador de Necessidades Especial?</p>

            <div class="checkboxes">

                <label>
                    <input type="checkbox">
                    Deficiente Visual
                </label>

                <label>
                    <input type="checkbox">
                    Deficiente Auditivo
                </label>

                <label>
                    <input type="checkbox">
                    Deficiente Físico
                </label>

                <label>
                    <input type="checkbox">
                    Múltiplas Deficiências
                </label>

                <label>
                    <input type="checkbox">
                    Outros:
                </label>

            </div>

        </section>
        <section class="parte-inferior">

            <div class="curso">

                <h3>Opção de Curso</h3>

                <select>
                    <option></option>
                    <option>Administração</option>
                    <option>Informática</option>
                    <option>Enfermagem</option>
                    <option>Desenvolvimento de Sistemas</option>
                </select>

                <button type="button">
                    Tabela de Curso no Verso.
                </button>

            </div>

            <div class="atencao">

                <strong>ATENÇÃO</strong>

                <p>
                    Leia o preenchimento e recolha a taxa de
                    <strong>R$50,00</strong> na tesouraria do ETEC.
                </p>

            </div>

        </section>
        <div class="botoes">

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
            <button type="button" onclick="window.print()">Imprimir</button>

        </div>

    </main>

</body>
</html>
